trigger:
  batch: true
  branches:
    include:
      - "main"

variables:
- name: BuildPlatform
  value : 'x64'
- name: BuildConfiguration
  value: 'release'
- name: SolutionBaseName
  value: 'SFA.DAS.Payments.EarningEvents'
- name: ArtifactName
  value: 'EarningBridge'
- group: Release Management Resources
- group: RELEASE das-payments-v2-earningevents
- group: Common - Connection String
- group: Common -  Storage Account
- group: DCOL-DST - Environment Key Vault Secrets

resources:
  repositories:
    - repository: self
    - repository: das-platform-building-blocks
      type: github
      name: SkillsFundingAgency/das-platform-building-blocks
      endpoint: SkillsFundingAgency
      ref: refs/heads/master
    - repository: das-platform-automation
      type: github
      name: SkillsFundingAgency/das-platform-automation
      endpoint: SkillsFundingAgency
      ref: refs/heads/master
    - repository: DevOps-Utilities
      type: git
      name: DCT/DevOps-Utilities
      ref: refs/heads/master

stages:
- stage: Build
  jobs:
  - template: pipeline-templates/job/code-build.yml

- template: azure-pipelines-templates/deploy/stage/nuget-publish.yml
